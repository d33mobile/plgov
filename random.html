<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Losowa edycja polskiej Wikipedii z adresu IP polskiej administracji publicznej</title>
<link rel="stylesheet" href="style.css">
<style>
#controls {
    align-items: baseline;
    display: flex;
    flex-wrap: wrap;
    gap: 1em;
}

#frame {
    border: 1px solid #ccc;
    height: 70vh;
    margin-top: 1em;
    width: 100%;
}

@media (prefers-color-scheme: dark) {
    #frame { border-color: #444; }
}
</style>
</head>

<body>
<nav><a href="index.html">Pełna lista</a> | <a href="top.html">Najczęściej edytowane</a></nav>

<h1>Losowa edycja</h1>

<p>Oglądasz losową zmianę w polskiej Wikipedii dokonaną z adresu IP należącego do
polskiej administracji publicznej. Więcej informacji znajdziesz
<a href="https://github.com/d33tah/plgov/blob/master/README-PL.md">TUTAJ</a>.</p>

<p id="controls">
<button id="next" type="button">Losuj następną</button>
<label>Widok: <select id="view">
<option value="visual">wizualny</option>
<option value="source">kod źródłowy</option>
</select></label>
</p>

<p id="details">Wczytywanie…</p>

<iframe id="frame" title="Podgląd zmiany w Wikipedii" src="about:blank"></iframe>

<script>
"use strict";

// See the note in app.js for why these are the parameters they are.
var VISUAL_DIFF =
    "https://pl.wikipedia.org/w/index.php?useformat=mobile&diffmode=visual&diff=prev&oldid=";
var SOURCE_DIFF = "https://pl.wikipedia.org/w/index.php?diffmode=source&diff=prev&oldid=";

var details = document.getElementById("details");
var frame = document.getElementById("frame");
var button = document.getElementById("next");
var viewSelect = document.getElementById("view");
var rows = [];
var current = null;

function base() {
    return viewSelect.value === "source" ? SOURCE_DIFF : VISUAL_DIFF;
}

// Re-renders whatever edit is on screen; pickRandom() draws a new one first.
function show() {
    var rdns = current[1], title = current[2], oldid = current[4];
    var other = viewSelect.value === "source"
        ? ["wersja wizualna", VISUAL_DIFF]
        : ["wersja z kodem źródłowym", SOURCE_DIFF];

    details.textContent = "";
    details.append(
        "Artykuł: ",
        link(title, base() + oldid),
        rdns ? " · Domena: " + rdns : "",
        " · ",
        link(other[0], other[1] + oldid)
    );
    frame.src = base() + oldid;
}

function pickRandom() {
    current = rows[Math.floor(Math.random() * rows.length)];
    show();
}

function link(text, href) {
    var a = document.createElement("a");
    a.textContent = text;
    a.href = href;
    return a;
}

fetch("data/edits.json").then(function (response) {
    if (!response.ok) {
        throw new Error("HTTP " + response.status);
    }
    return response.json();
}).then(function (data) {
    rows = data.rows;
    button.addEventListener("click", pickRandom);
    // Switching the view keeps the current edit, so you can read the same
    // change as markup without losing it to a reshuffle.
    viewSelect.addEventListener("change", show);
    pickRandom();
}).catch(function (error) {
    details.textContent = "Nie udało się wczytać danych: " + error.message;
});
</script>
</body>
</html>
